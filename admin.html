<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cyber Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="dashboard">


<div class="sidebar" id="sidebar">
  <h4>CyberSecure</h4>

  <ul>

  <li class="active">
    <a href="admin.html">
      <i class="bi bi-grid"></i> Dashboard
    </a>
  </li>

  <li>
    <a href="analystics.html">
      <i class="bi bi-graph-up"></i> Analytics
    </a>
  </li>


  <li>
    <a href="settings.html">
      <i class="bi bi-house"></i> Back To Home
    </a>
  </li>

</ul>
</div>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="main">

<div class="topbar">

  <div class="top-left">
    <button class="menu-btn" onclick="toggleSidebar()">
      <i class="bi bi-list"></i>
    </button>

    <input type="text" placeholder="Search threats..." class="search-box">
  </div>

  <div class="top-right">

    <i class="bi bi-bell notification"></i>

    <div class="profile">
      <img src="https://i.pravatar.cc/40">
      <span id="adminEmail"></span>
    </div>

  </div>

</div>

<div class="cards">

  <div class="card">
    <h6>Total Vulnerabilities</h6>
    <h2 id="count1">0</h2>
  </div>

  <div class="card">
    <h6>Resolved</h6>
    <h2 id="count2">0</h2>
  </div>

  <div class="card">
    <h6>Remaining</h6>
    <h2 id="count3">0</h2>
  </div>

  <div class="card">
    <h6>Threat Level</h6>
    <h2>High</h2>
  </div>

</div>

<div class="charts">

  <div class="chart-box">
    <canvas id="lineChart"></canvas>
  </div>

  <div class="chart-box">
    <canvas id="pieChart"></canvas>
  </div>

</div>

<div class="table-box">

<h5>Incident Management</h5>

<table class="table table-dark table-hover">
<thead>
<tr>
<th >ID</th>
<th >Threat</th>
<th>Severity</th>
<th>Status</th>
</tr>
</thead>

<tbody>
<tr>
<td>#101</td>
<td>Phishing</td>
<td>High</td>
<td>
  <span class="status-badge bg-danger rounded-pill px-3 py-2">
    Open
  </span>
</tr>

<tr>
<td>#102</td>
<td>Malware</td>
<td>Critical</td>
<td>
  <span class="status-badge bg-success rounded-pill px-3 py-2">
    Resolved
  </span>
</td>
</tr>

<tr>
<td>#103</td>
<td>DDoS</td>
<td>Medium</td>
<td>
  <span class="status-badge bg-warning rounded-pill px-3 py-2">
    Investigating
  </span>
</tr>

</tbody>
</table>

</div>

</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="admin.js"></script>
<script>
//   function toggleSidebar() {
//   let sidebar = document.getElementById("sidebar");
//   let overlay = document.getElementById("overlay");

//   if(sidebar) sidebar.classList.toggle("active");
//   if(overlay) overlay.classList.toggle("active");
// }
function toggleSidebar() {
  let sidebar = document.getElementById("sidebar");
  let overlay = document.getElementById("overlay");

  if (sidebar && overlay) {
    sidebar.classList.toggle("active");
    overlay.classList.toggle("active");
  }
}

function closeSidebar() {
  let sidebar = document.getElementById("sidebar");
  let overlay = document.getElementById("overlay");

  if (sidebar && overlay) {
    sidebar.classList.remove("active");
    overlay.classList.remove("active");
  }
}
document.querySelectorAll(".sidebar ul li").forEach(item => {
  item.addEventListener("click", () => {
    if(window.innerWidth < 768){
      toggleSidebar();
    }
  });
});
</script>
</body>
</html>
