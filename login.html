<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberSecure Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-container">

   <div class="back-wrapper">
    <a href="index.html" class="back-home">
      <i class="bi bi-arrow-left"></i> Back to Home
    </a>
  </div>

  <div class="login-card">

    <div class="login-icon">
      <i class="bi bi-shield-lock"></i>
    </div>

    <h2>Welcome Back</h2>
    <p>Login to access your Cybersecurity dashboard</p>

    <form id="loginForm">

      
      <label><bold>Login As</bold></label>
      <select id="role" class="form-control mb-3">
        <option disabled selected>Select Role</option>
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>

    
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="email" class="form-control" placeholder="your@example.com" required>
      </div>

<div class="input-group mb-3 password-box">
    <span class="input-group-text"><i class="bi bi-lock"></i></span>

     <input type="password" id="password" class="form-control" placeholder="Password" required>

        <span class="input-group-text eye-icon" onclick="togglePassword()">
            <i id="eyeIcon" class="bi bi-eye"></i>
        </span>
</div>

      <div class="d-flex justify-content-between mb-3">
        <div>
          <input type="checkbox" required> Remember me
        </div>
        <a href="error.html">Forgot password?</a>
      </div>
      <button type="submit" class="login-btn">
        Login to Dashboard
      </button>

    </form>

    <p class="mt-3">
      Don't have an account? <a href="register.html">Sign up</a>
    </p>

  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
   document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();

  let role = document.getElementById("role").value;
  let email = document.querySelector("input[type='email']").value;

  localStorage.setItem("userEmail", email);
  localStorage.setItem("userRole", role);
  if(role === "admin") {
    window.location.href = "admin.html";
  } else {
    window.location.href = "user.html";
  }
});
function togglePassword() {
  let password = document.getElementById("password");
  let icon = document.getElementById("eyeIcon");

  if (password.type === "password") {
    password.type = "text";
    icon.classList.remove("bi-eye");
    icon.classList.add("bi-eye-slash");
  } else {
    password.type = "password";
    icon.classList.remove("bi-eye-slash");
    icon.classList.add("bi-eye");
  }
}
</script>
</body>
</html>
