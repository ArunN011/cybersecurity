<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threat Monitoring </title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="threat.css">

</head>
<body>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="sidebar" id="sidebar">
  <h2>CyberSecure</h2>

  <ul>
    <li><a href="user.html"><i class="bi bi-grid"></i> Dashboard</a></li>
    <li class="active"><a href="threat.html"><i class="bi bi-shield-lock"></i> Threat Monitor</a></li>
    <li><a href="index.html"><i class="bi bi-house"></i> Back Home</a></li>
    <li onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</li>
  </ul>
</div>

<div class="main">

  <div class="topbar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>

    <div class="profile">
      <i class="bi bi-bell"></i>
      <span id="userEmail"></span>
    </div>
  </div>

  <div class="map-box">
    <h3>🌍 Live Attack Network</h3>
    <div class="map" id="map"></div>
  </div>

  <div class="ai-panel">
    <h3>🤖 AI Threat Intelligence</h3>
    <p id="aiText">Initializing AI engine...</p>
  </div>

  <div class="logs">
    <h3><i class="bi bi-bug-fill"></i> Live Attack Feed</h3>
    <ul id="logList"></ul>
  </div>

</div>

<div class="chatbot">
  <div class="chat-header" onclick="toggleChat()">AI Security Bot</div>
  <div class="chat-body" id="chatBody"></div>
  <input type="text" id="chatInput" placeholder="Ask about threats..." onkeypress="sendMessage(event)">
</div>

<script src="threat.js"></script>
</body>
</html>
